name: Gameplay checks
on: [push, pull_request]
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Checks -B build
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Exercise gameplay rules
        run: ./build/flight_checks
