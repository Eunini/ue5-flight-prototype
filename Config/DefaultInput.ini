; Legacy axis mappings keep the prototype asset-free. A production build would
; move these to Enhanced Input actions and mapping contexts.
[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
+AxisMappings=(AxisName="Pitch",Scale=1.0,Key=S)
+AxisMappings=(AxisName="Pitch",Scale=-1.0,Key=W)
+AxisMappings=(AxisName="Pitch",Scale=-1.0,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="Roll",Scale=1.0,Key=D)
+AxisMappings=(AxisName="Roll",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="Roll",Scale=1.0,Key=Gamepad_LeftX)
+AxisMappings=(AxisName="Yaw",Scale=1.0,Key=E)
+AxisMappings=(AxisName="Yaw",Scale=-1.0,Key=Q)
+AxisMappings=(AxisName="ThrottleChange",Scale=1.0,Key=LeftShift)
+AxisMappings=(AxisName="ThrottleChange",Scale=-1.0,Key=LeftControl)
+AxisMappings=(AxisName="LookYaw",Scale=1.0,Key=MouseX)
+AxisMappings=(AxisName="LookPitch",Scale=-1.0,Key=MouseY)
+ActionMappings=(ActionName="Brake",Key=B)
+ActionMappings=(ActionName="Interact",Key=F)
+ActionMappings=(ActionName="ToggleDiagnostics",Key=Tab)
+ActionMappings=(ActionName="ToggleCabinView",Key=V)
